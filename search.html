<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dog search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --field: #EDF1EA;
    --paper: #FFFFFF;
    --spruce: #14312B;
    --moss: #4E6A60;
    --hivis: #FFB300;
    --line: #C9D3CB;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--field);
    color: var(--spruce);
    font-family: "Atkinson Hyperlegible", Verdana, "Segoe UI", sans-serif;
    font-size: 1.125rem;
    line-height: 1.45;
  }
  .tape {
    height: 14px;
    background: repeating-linear-gradient(-45deg, var(--hivis) 0 18px, var(--spruce) 18px 36px);
  }
  main { max-width: 34rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  .kind { margin: 0; font-weight: 700; color: var(--moss); }
  h1 { font-size: 2.75rem; line-height: 1.05; margin: .1rem 0 .3rem; overflow-wrap: anywhere; }
  .sent { margin: 0 0 1.25rem; color: var(--moss); font-size: 1rem; }
  .photo {
    display: block;
    width: 100%;
    max-height: 26rem;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 1.25rem;
    background: var(--line);
  }
  .nophoto {
    margin: 0 0 1.25rem;
    padding: .8rem 1rem;
    border: 2px dashed var(--line);
    border-radius: 12px;
    color: var(--moss);
    font-size: 1rem;
  }
  .notes {
    margin: 0 0 1.25rem;
    padding: 1rem 1.1rem;
    background: var(--spruce);
    color: #fff;
    border-radius: 12px;
    font-weight: 700;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  dl { margin: 0 0 1.5rem; background: var(--paper); border-radius: 12px; border: 2px solid var(--line); }
  dl > div { padding: .8rem 1rem; border-top: 2px solid var(--line); }
  dl > div:first-child { border-top: 0; }
  dt { color: var(--moss); font-size: 1rem; }
  dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
  .btn {
    display: block;
    text-align: center;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.25rem;
    padding: 1rem;
    border-radius: 8px;
    border: 2px solid var(--spruce);
    color: var(--spruce);
    background: var(--paper);
    margin-top: .75rem;
  }
  .btn.main { background: var(--hivis); }
  .btn:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--spruce); outline-offset: 2px; }
  .reply {
    margin: 0 0 1.5rem; padding: 1rem 1.1rem 1.2rem;
    background: var(--paper); border: 2px solid var(--spruce); border-radius: 12px;
  }
  .reply h2 { font-size: 1.375rem; margin: 0 0 .2rem; }
  .reply label { display: block; font-weight: 700; margin: .9rem 0 .3rem; }
  .reply .hint { display: block; font-weight: 400; color: var(--moss); font-size: 1rem; }
  .reply input {
    width: 100%; font: inherit; color: inherit; background: var(--paper);
    border: 2px solid var(--line); border-radius: 8px; padding: .7rem .8rem;
  }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: 1rem; }
  .choices button {
    font: inherit; font-weight: 700; min-height: 60px; padding: .6rem;
    border-radius: 8px; border: 2px solid var(--spruce);
    background: var(--paper); color: var(--spruce); cursor: pointer;
  }
  .choices button.yes { background: var(--hivis); }
  .choices button[aria-pressed="true"] { background: var(--spruce); color: #fff; }
  .choices button:disabled { opacity: .55; cursor: not-allowed; }
  .replystatus { margin: .9rem 0 0; font-weight: 700; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="tape" aria-hidden="true"></div>
<main>
  <div id="empty" hidden>
    <h1>No search details</h1>
    <p>This page shows the details of a search when you open it from an alert. Open the latest alert in the ntfy app and tap it.</p>
  </div>

  <div id="search" hidden>
    <p class="kind" id="kind"></p>
    <h1 id="name"></h1>
    <p class="sent" id="sent"></p>

    <img class="photo" id="photo" alt="" hidden>
    <p class="nophoto" id="nophoto" hidden></p>

    <p class="notes" id="notes" hidden></p>

    <dl id="facts"></dl>

    <section class="reply" id="reply" hidden>
      <h2>Can you help?</h2>
      <label for="who">Your name</label>
      <input id="who" autocomplete="name" maxlength="60">
      <label for="note">Note for the coordinator
        <span class="hint">Optional, such as when you can arrive.</span>
      </label>
      <input id="note" autocomplete="off" maxlength="140">
      <div class="choices">
        <button type="button" class="yes" id="yesBtn" aria-pressed="false">I'm available</button>
        <button type="button" id="noBtn" aria-pressed="false">Not available</button>
      </div>
      <p class="replystatus" id="replyStatus" role="status" hidden></p>
    </section>

    <a class="btn main" id="mapBtn" target="_blank" rel="noopener" hidden>Open last seen location in maps</a>
    <a class="btn" id="callBtn" hidden></a>
  </div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var get = function (k) { return (q.get(k) || "").trim(); };

  var name = get("n");
  if (!name) { $("empty").hidden = false; return; }

  $("search").hidden = false;
  document.title = "Search: " + name;
  $("kind").textContent = get("u") ? "Search update" : "Search active";
  $("name").textContent = name;

  var at = Number(get("at"));
  if (at > 0) {
    var d = new Date(at), today = new Date().toDateString() === d.toDateString();
    $("sent").textContent = "Alert sent " +
      (today ? "today" : d.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" })) +
      " at " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  // Only photos stored by the alert service are shown.
  var p = get("p");
  if (/^https:\/\/ntfy\.sh\/file\/[A-Za-z0-9._-]+$/.test(p)) {
    var img = $("photo");
    img.alt = "Photo of " + name;
    img.onerror = function () {
      img.hidden = true;
      $("nophoto").textContent = "The photo is no longer available. It is still in the alert in the ntfy app if your phone downloaded it, or ask the coordinator to resend.";
      $("nophoto").hidden = false;
    };
    img.src = p;
    img.hidden = false;
  }

  if (get("x")) { $("notes").textContent = get("x"); $("notes").hidden = false; }

  function fact(label, value) {
    if (!value) return;
    var row = document.createElement("div");
    var dt = document.createElement("dt"); dt.textContent = label;
    var dd = document.createElement("dd"); dd.textContent = value;
    row.appendChild(dt); row.appendChild(dd);
    $("facts").appendChild(row);
  }
  var need = [];
  if (get("g")) need.push("Ground search teams");
  if (get("dr")) need.push("Drone search");
  fact("Needed", need.join(" and "));
  fact("Description", get("d"));
  fact("Last seen", [get("s"), get("t")].filter(Boolean).join(", "));
  fact("Meeting point", get("m"));
  fact("Coordinator", get("c"));
  if (!$("facts").children.length) $("facts").hidden = true;

  if (get("s")) {
    $("mapBtn").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(get("s"));
    $("mapBtn").hidden = false;
  }

  var num = (get("c").match(/\+?\d[\d\s()-]{6,}\d/) || [""])[0].replace(/[^\d+]/g, "");
  if (num) {
    $("callBtn").href = "tel:" + num;
    $("callBtn").textContent = "Call the coordinator";
    $("callBtn").hidden = false;
  }

  // Replies go to the channel created for this search; the coordinator's page collects them.
  var r = get("r");
  if (/^ldreply-[a-z0-9]{10,40}$/.test(r)) {
    var load = function (k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };
    var save = function (k, val) { try { localStorage.setItem(k, val); } catch (e) {} };
    var say = function (text) { $("replyStatus").textContent = text; $("replyStatus").hidden = false; };
    var mark = function (a) {
      $("yesBtn").setAttribute("aria-pressed", a === "1" ? "true" : "false");
      $("noBtn").setAttribute("aria-pressed", a === "0" ? "true" : "false");
    };

    $("reply").hidden = false;
    $("who").value = load("volName");
    var mine = load("reply:" + r);
    if (mine) {
      mark(mine);
      say("You answered: " + (mine === "1" ? "available" : "not available") + ". Tap the other button to change it.");
    }

    var id = load("volId");
    if (!id) {
      var a = new Uint8Array(12); crypto.getRandomValues(a);
      id = Array.prototype.map.call(a, function (b) { return (b % 36).toString(36); }).join("");
      save("volId", id);
    }

    var reply = function (yes) {
      var who = $("who").value.trim();
      if (!who) { say("Add your name so the coordinator knows who answered."); $("who").focus(); return; }
      save("volName", who);
      $("yesBtn").disabled = $("noBtn").disabled = true;
      say("Sending your answer\u2026");
      fetch("https://ntfy.sh", {
        method: "POST",
        body: JSON.stringify({
          topic: r,
          title: who + (yes ? " is available" : " is not available"),
          message: JSON.stringify({ id: id, name: who, a: yes ? 1 : 0, note: $("note").value.trim() }),
          priority: 2
        })
      }).then(function (res) {
        if (!res.ok) throw new Error("error " + res.status);
        save("reply:" + r, yes ? "1" : "0");
        mark(yes ? "1" : "0");
        say(yes ? "Answer sent: you are available. Thank you." : "Answer sent: you are not available. Thank you for letting us know.");
      }).catch(function () {
        say("Your answer was not sent. Check your signal and tap again.");
      }).then(function () {
        $("yesBtn").disabled = $("noBtn").disabled = false;
      });
    };
    $("yesBtn").addEventListener("click", function () { reply(true); });
    $("noBtn").addEventListener("click", function () { reply(false); });
  }
})();
</script>
</body>
</html>
